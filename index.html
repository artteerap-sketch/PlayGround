<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#9fe1d4">
<title>Puddlebrook • Little Fishing Day</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game"><canvas id="world"></canvas><div class="vignette"></div>
<header class="topbar">
 <div class="brand"><div class="brand-icon">🐟</div><div><b>Puddlebrook</b><small>LITTLE FISHING DAY</small></div></div>
 <div class="stats"><div class="stat money"><span class="stat-icon">✦</span><div><small>MONEY</small><b id="money">$0</b></div></div><div class="stat fish-stat"><span class="stat-icon">◉</span><div><small>FISH</small><b id="fish-count">0</b></div></div></div>
 <button class="inventory-button" id="inventory-open" aria-label="Open fish bag"><span>🎒</span><span class="bag-label">Bag</span><i id="bag-dot"></i></button>
</header>
<div class="day-pill"><span class="sun">☀</span> DAY 1 <span class="divider">•</span> 8:42 AM</div>
<div class="hint" id="hint"><span class="hint-icon">✦</span><span>Find a spot by the pond and cast your line</span></div>
<div class="location-tag" id="location-tag"><span>◌</span> Willow Pond</div>
<div class="controls" id="controls"><div class="stick-zone" id="stick-zone"><div class="stick-base"><div class="stick-knob" id="stick-knob"><span></span></div></div><small>MOVE</small></div>
<button class="action-button" id="action"><span class="action-icon">⌁</span><b id="action-label">CAST</b><small id="action-sub">BY THE WATER</small></button></div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop hidden" id="modal"><section class="modal-card" id="modal-card"></section></div>
<div class="minigame hidden" id="minigame"><div class="bite-title"><span class="sparkle">✦</span><div><small>A LITTLE NIBBLE!</small><b id="fish-name">Pond fish</b></div><span class="rarity-chip" id="rarity-chip">COMMON</span></div><div class="catch-stage"><div class="track"><div class="progress-fill" id="progress-fill"></div><div class="fishing-bar" id="fishing-bar"><span class="bar-glint"></span></div><div class="fish-marker" id="fish-marker"><span>🐟</span></div><div class="track-tick"></div></div><div class="track-labels"><span>KEEP THE FISH IN THE GREEN</span><span id="progress-percent">0%</span></div></div><div class="catch-instructions"><span>HOLD</span><span class="instruction-dot">•</span><span>TAP</span><span class="instruction-dot">•</span><span>KEEP IT CLOSE!</span></div></div>
<footer class="footer-note"><span>✿</span> A quiet day in Puddlebrook</footer>
</main>
<script type="module" src="game.js"></script>
</body></html>
